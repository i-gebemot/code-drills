public static $void$ Arrange(int[] arr) {
        ^... ~o hr implement
    int[] tmp = $Copy(arr);$
        ^... ~o hr implement
    int next = $0;$
        ^... ~o hr implement
    for ($int i = 0; i < tmp.Length; i++$)
        ^... ~o hr implement
    {
        if ($tmp[i] >= 0$)
            ^... ~o hr implement
        {
            arr[$next$] = $tmp[i];$
                ^... ~o hr implement
                ^... ~o hr implement
            $next++;$
                ^... ~o hr implement
        }
    }
    for ($int i = 0; i < tmp.Length; i++$)
        ^... ~o hr implement
    {
        if ($tmp[i] < 0$)
            ^... ~o hr implement
        {
            arr[$next$] = $tmp[i];$
                ^... ~o hr implement
                ^... ~o hr implement
            $next++;$
                ^... ~o hr implement
        }
    }
}

// מקבלת מספר ומחזירה כמות הסיפרות בו
public static int Length(int num)
{
    int len = 0;
    while (num > 0)
    {
        len++;
        $num /= 10;$
            ^... ~o hr implement
    }
    return len;
}

Print(Length(1234) == $1234.ToString().Length$);
    ^... ~o hr implement
Print(Length(1234) == $Convert.ToString(1234).Length$);
    ^... ~o hr implement

// מחזירה מזלה של מספר
public static int Pow($int num, int p$)
        ^... ~o hr implement
{
    int mul = $1;$
        ^... ~o hr implement
    while (p > 0)
    {
        $mul *= num;$
            ^... ~o hr implement
        p--;
    }
    return mul;
}

Print(Pow(2, 5) == $Math.Pow(2, 5)$);
    ^... ~o hr implement

public static bool IsNarc(int num) {
    int sum = 0;
    int len = $num.ToString().Length;$
        ^... ~o hr implement
    int n = $num;$
        ^... ~o hr implement
    while ($n > 0$)
        ^... ~o hr implement
    {
        sum += $Math.Pow(n % 10, len);$
            ^... ~o hr implement
        $n /= 10;$
            ^... ~o hr implement
    }
    return $num == sum;$
        ^... ~o hr implement
}
</drill>

public static int DayReport(Transport[] arr, int day,
                            bool forward)
{
    int sum = $0;$
        ^... ~o hr implement
    foreach ($Transport tr in arr$) {
            ^... ~o hr implement
        if ($tr.GetDay() == day$ && 
                ^... ~o hr implement
            $tr.GetToSchool() == forward$)
                ^... ~o hr implement
        {
            sum += $tr.GetNum();$
                ^... ~o hr implement
        }
    }
    $return sum;$
        ^... ~o hr implement
}

public static bool IsPerfect(int num)
{
    int sum = $0;$
        ^... ~o hr implement
    for ($int i = 1; i < num; i++$)
        ^... ~o hr implement
    {
        if ($num % i == 0$)
                ^... ~o hr implement
            $sum += i;$
                ^... ~o hr implement
    }
    return $sum == num;$
        ^... ~o hr implement
}

public static $void$ ThePerfects(int low, int high)
    ^... ~o hr implement
{
    for ($int num = low; num <= high; num++$)
        ^... ~o hr implement
    {
        if ($IsPerfect(num)$)
                ^... ~o hr implement
            $Console.WriteLine(num);$
                ^... ~o hr implement
    }
}
