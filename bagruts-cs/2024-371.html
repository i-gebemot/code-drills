{

                ^... ~o ht implement
    }

}

public static int[] Customers(TourPackage[] packages) {

        ^... ~o ht implement

        ^... ~o ht implement
    int count = $0;$
        ^... ~o ht implement

public static int DigitSum(int num)
{
    int sum = $0;$
        ^... ~o ht implement
    while ($num > 0$)
        ^... ~o ht implement
    {
        sum += $num % 10;$
            ^... ~o ht implement
        $num /= 10;$
            ^... ~o ht implement
    }
    return $sum;$
        ^... ~o ht implement
}

public static int DeepSum(int num1)
{
    while ($num1 > 9$)
        ^... ~o ht implement
        num1 = $DigitSum(num1);$
            ^... ~o ht implement
    return $num1;$
        ^... ~o ht implement
}
</drill>

{

        ^... ~o ht implement
    int odds = $0;$
        ^... ~o ht implement
    for ($int i = 1; i <= 999999; i++$)

}

public static bool DigitExists(int num, int dgt)
{
    while ($num > 0$)
        ^... ~o ht implement
    {
        if ($num % 10 == dgt$)
                ^... ~o ht implement
            return $true;$
                ^... ~o ht implement
        $num /= 10;$
            ^... ~o ht implement
    }
    return $false;$
        ^... ~o ht implement
}

public static bool InBoth(int num1, int num2)
{
    return DigitExists($num1$, $DeepSum(num2)$) &&
                ^... ~o ht implement
                ^... ~o ht implement                {+}
           DigitExists($num2$, $DeepSum(num1)$);
                ^... ~o ht implement
                ^... ~o ht implement                {+}
}
