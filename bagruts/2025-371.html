<drill lang="java" id="q2-solution" no-wrong-phase>
public static $void$ arrange(int[] arr) {
        ^... ~o hr implement
    int[] tmp = $copy(arr);$
        ^... ~o hr implement
    int next = $0;$
        ^... ~o hr implement
    for ($int i = 0; i < tmp.length; i++$) {
            ^... ~o hr implement
        if ($tmp[i] >= 0$) {
                ^... ~o hr implement
            arr[$next$] = $tmp[i];$
                ^... ~o hr implement
                ^... ~o hr implement
            $next++;$
                ^... ~o hr implement
        }
    }
    for ($int i = 0; i < tmp.length; i++$) {
            ^... ~o hr implement
        if ($tmp[i] < 0$) {
                ^... ~o hr implement
            arr[$next$] = $tmp[i];$
                ^... ~o hr implement
                ^... ~o hr implement
            $next++;$
                ^... ~o hr implement
        }
    }
}
</drill>

<drill lang="java" id="q3-helpers" no-wrong-phase>
// מקבלת מספר ומחזירה כמות הסיפרות בו
public static int length(int num) {
    int len = 0;
    while (num > 0) {
        len++;
        $num /= 10;$
            ^... ~o hr implement
    }
    return len;
}

print(length(1234) == $Integer.toString(1234).length()$);
    ^... ~o hr implement
print(length(1234) == $String.valueOf(1234).length()$);
    ^... ~o hr implement

// מחזירה מזלה של מספר
public static int pow($int num, int p$) {
        ^... ~o hr implement
    int mul = $1;$
        ^... ~o hr implement
    while (p > 0) {
        $mul *= num;$
            ^... ~o hr implement
        p--;
    }
    return mul;
}

print(pow(2, 5) == $Math.pow(2, 5)$);
    ^... ~o hr implement
</drill>

<drill lang="java" id="q3-isNarc()" no-wrong-phase>
$!html <img src="img/2025-371-q3-a.png">
public static boolean isNarc(int num) {
    int sum = 0;
    int len = $Integer.toString(num).length();$
        ^... ~o hr implement
    int n = $num;$
        ^... ~o hr implement
    while ($n > 0$) {
            ^... ~o hr implement
        sum += $Math.pow(n % 10, len);$
            ^... ~o hr implement
        $n /= 10;$
            ^... ~o hr implement
    }
    return $num == sum;$
        ^... ~o hr implement
}
</drill>

public static int dayReport(Transport[] arr, int day,
                            boolean forward)
{
    int sum = $0;$
        ^... ~o hr implement
    for ($Transport tr: arr$) {
            ^... ~o hr implement
        if ($tr.getDay() == day$ && $tr.getToSchool() == forward$) {
                ^... ~o hr implement
                ^... ~o hr implement    {+}
            sum += $tr.getNum();$
                ^... ~o hr implement
        }
    }
    $return sum;$
        ^... ~o hr implement
}
