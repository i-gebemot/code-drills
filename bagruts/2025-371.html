public static boolean isNarc(int num) {
    int sum = 0;
    int len = $Integer.toString(num).length();$
        ^... ~o hr implement
    int n = $num;$
        ^... ~o hr implement
    while ($n > 0$) {
            ^... ~o hr implement
        sum += $Math.pow(n % 10, len);$
            ^... ~o hr implement
        $n /= 10;$
            ^... ~o hr implement
    }
    return $num == sum;$
        ^... ~o hr implement
}
</drill>
